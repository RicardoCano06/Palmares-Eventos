<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Palmares - Salón de Eventos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/png" href="/Imagen1.png" />
    <meta
      name="description"
      content="Palmares Salón de Eventos en Fernando de la Mora, Paraguay. El lugar perfecto para bodas, cumpleaños, colaciones y eventos empresariales. Quincho con parrilla, pileta iluminada y generador propio. Hasta 120 invitados. Cotizá hoy."
    />
    <meta name="keywords" content="Palmares, salón de eventos, Fernando de la Mora, bodas, cumpleaños, colaciones, quincho, parrilla, pileta, generador propio, salón Paraguay, eventos Asunción" />
    <meta name="robots" content="index, follow" />
    <style>
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        background: #F9F9F5;
        color: #111215;
        font-family: 'Inter', sans-serif;
      }
      h1, h2, h3, h4, .font-display {
        font-family: 'Plus Jakarta Sans', sans-serif;
        letter-spacing: -0.03em;
      }
      @keyframes fade-up {
        from { opacity: 0; transform: translateY(40px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes pulse-glow {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.03); }
      }
      @keyframes shine {
        0% { background-position: -200% center; }
        100% { background-position: 200% center; }
      }
      .animate-fade-up { animation: fade-up 0.8s ease-out both; }
      .animate-fade-up-1 { animation: fade-up 0.8s ease-out 0.15s both; }
      .animate-fade-up-2 { animation: fade-up 0.8s ease-out 0.3s both; }
      .animate-fade-up-3 { animation: fade-up 0.8s ease-out 0.45s both; }
      .animate-pulse-glow { animation: pulse-glow 2s ease-in-out infinite; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
  </html>
